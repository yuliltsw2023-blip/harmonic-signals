name: Scan H4 Harmonic Patterns

on:
  schedule:
    # UTC. Tiap 4 jam, 5 menit setelah bar H4 close.
    # Free tier Twelve Data delay ~4 jam → yang ter-fetch bar sebelumnya
    # (lihat README "Data delay"). Dedup mencegah double-send.
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      CHART_IMG_API_KEY: ${{ secrets.CHART_IMG_API_KEY }}
      CHART_IMG_LAYOUT_ID: ${{ vars.CHART_IMG_LAYOUT_ID }}
      SIGNAL_VERBOSE: ${{ vars.SIGNAL_VERBOSE || 'false' }}
      ENTRY_MODE: ${{ vars.ENTRY_MODE || 'in_prz' }}
      MIN_RR_TP2: ${{ vars.MIN_RR_TP2 || '2.0' }}
      LOG_LEVEL: info
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cek secret (panjang + fingerprint)
        run: python scripts/manual/check_secrets.py

      - name: Run H4 scan
        run: python scripts/scan_h4.py
