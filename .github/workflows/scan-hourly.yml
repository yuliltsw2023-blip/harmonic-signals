name: Scan Hourly (H1 + H4 + D1)

on:
  schedule:
    # 1 menit setelah candle close, Senin–Jumat saja (UTC). Job ini menjalankan
    # H1 tiap jam, H4 di jam 0/4/8/12/16/20, dan D1 di jam 00 — satu setup per jam.
    # Sabtu–Minggu forex tutup: run cuma buang ~1 menit setup tanpa hasil
    # (≈200 menit/bulan). Crypto (BTC/ETH) sengaja ikut libur — skill: hindari
    # entry weekend, volume tipis.
    - cron: "1 * * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Paksa timeframe (mis. H4,D1). Kosong = sesuai jam."
        required: false
        default: ""

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      CHART_IMG_API_KEY: ${{ secrets.CHART_IMG_API_KEY }}
      CHART_IMG_LAYOUT_ID: ${{ vars.CHART_IMG_LAYOUT_ID }}
      SIGNAL_VERBOSE: ${{ vars.SIGNAL_VERBOSE || 'false' }}
      SIGNAL_STAGES: ${{ vars.SIGNAL_STAGES || 'approaching,in_prz,left' }}
      MIN_RR_TP2: ${{ vars.MIN_RR_TP2 || '2.0' }}
      # Auto-eksekusi MT5 opt-in: backtest 24 Sep 2026 tidak menemukan edge (PF 0.92).
      # Set Variable MT5_QUEUE=true untuk mengaktifkan lagi.
      MT5_QUEUE: ${{ vars.MT5_QUEUE || 'false' }}
      LOG_LEVEL: info
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
      SCAN_FORCE: ${{ github.event.inputs.force }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cek secret (panjang + fingerprint)
        run: python scripts/manual/check_secrets.py

      - name: Run hourly scan
        run: python scripts/scan_hourly.py
