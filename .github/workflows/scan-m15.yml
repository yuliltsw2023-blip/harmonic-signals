name: Scan M15 Scalping (London/NY)

on:
  # Cron sengaja DIMATIKAN: 52 run/hari × ~2 menit ≈ 2.300 menit/bulan,
  # melebihi jatah 2.000 menit repo private (GitHub membulatkan tiap job
  # ke atas per menit). Aktifkan hanya kalau repo sudah public (unlimited)
  # atau H1 dimatikan. Tinggal hapus tanda # di dua baris berikut.
  # schedule:
  #   - cron: "*/15 7-19 * * 1-5"   # 07:00–19:59 UTC = London open → NY sore, Sen–Jum
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      CHART_IMG_API_KEY: ${{ secrets.CHART_IMG_API_KEY }}
      CHART_IMG_LAYOUT_ID: ${{ vars.CHART_IMG_LAYOUT_ID }}
      SIGNAL_VERBOSE: ${{ vars.SIGNAL_VERBOSE || 'false' }}
      SIGNAL_STAGES: ${{ vars.SIGNAL_STAGES || 'approaching,in_prz,left' }}
      MIN_RR_TP2: ${{ vars.MIN_RR_TP2 || '2.0' }}
      MT5_QUEUE: ${{ vars.MT5_QUEUE || 'true' }}
      SCALP_TIMEFRAME: ${{ vars.SCALP_TIMEFRAME || 'M15' }}
      LOG_LEVEL: info
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cek secret (panjang + fingerprint)
        run: python scripts/manual/check_secrets.py

      - name: Run M15 scalping scan
        run: python scripts/scan_m15.py
