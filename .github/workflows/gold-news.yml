name: Gold News Briefing

# 4 briefing per hari kerja (jam WIB musim dingin AS/Eropa; musim panas maju 1 jam):
#   06:30 Pra-Asia · 14:30 Pra-London · 19:30 Pra-New York · 21:00 Reaksi data AS
#   + Sabtu 06:30 Rekap Mingguan.
# Jadwal GitHub di bawah hanya CADANGAN (GitHub sering telat/melewatkan cron).
# Pemicu utama yang tepat waktu: cron-job.org → workflow_dispatch (lihat goldnews/README.md).
# Script sendiri yang menentukan slot mana yang jatuh tempo & tidak mengirim dobel.
on:
  schedule:
    - cron: "5,15,25 23 * * 0-5"     # Pra-Asia / Rekap Mingguan (23:30 UTC)
    - cron: "5,15,25 6,7 * * 1-5"    # Pra-London (06:30 / 07:30 UTC)
    - cron: "5,15,25 11,12 * * 1-5"  # Pra-New York (11:30 / 12:30 UTC)
    - cron: "35,45,55 12,13 * * 1-5" # Reaksi data AS (13:00 / 14:00 UTC)
  workflow_dispatch:
    inputs:
      slot:
        description: "Paksa slot (pre_asia, pre_london, pre_ny, post_us, weekly). Kosong = sesuai jam."
        required: false
        default: ""
      force:
        description: "true = kirim walau slot sudah terkirim"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GOLDNEWS_CHAT_ID: ${{ secrets.GOLDNEWS_CHAT_ID }}
      GOLDNEWS_MODEL: ${{ vars.GOLDNEWS_MODEL || 'claude-opus-5-5' }}
      GOLDNEWS_SITE_URL: ${{ vars.GOLDNEWS_SITE_URL || 'https://gold-briefing-beta.vercel.app' }}
      GOLDNEWS_SLOT: ${{ github.event.inputs.slot }}
      GOLDNEWS_FORCE: ${{ github.event.inputs.force }}
      GOLDNEWS_OUTBOX: ${{ github.workspace }}/outbox.txt
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: goldnews/requirements.txt

      - run: pip install -r goldnews/requirements.txt

      - name: Buat briefing
        run: python scripts/gold_news.py

      - name: Simpan data ke repo
        id: commit
        run: |
          if [ -n "$(git status --porcelain goldnews/site/data)" ]; then
            git config user.name "gold-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add goldnews/site/data
            git commit -q -m "Gold briefing: data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase
            git push -q
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy website (Vercel)
        if: steps.commit.outputs.changed == 'true'
        working-directory: goldnews/site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_9lRJqsM4vZoj1HD5eCJkLWTq
          VERCEL_PROJECT_ID: prj_OdVzwhK7Qcob2aH4qwn6j2sbJVqZ
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN belum di-set — website tidak di-update"; exit 0; fi
          npx --yes vercel@59 deploy --prod --yes --token "$VERCEL_TOKEN" > /dev/null
          echo "Website ter-update"

      - name: Kirim Telegram
        if: always() && hashFiles('outbox.txt') != ''
        run: python -m goldnews.send_outbox
